<VirtualHost *:80>
    ServerName 172.16.1.199
    DocumentRoot /var/www/agrored

    <Directory /var/www/agrored>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On

    # Salud de los microservicios
    ProxyPass        /api/usuarios/health http://127.0.0.1:3001/health
    ProxyPassReverse /api/usuarios/health http://127.0.0.1:3001/health

    ProxyPass        /api/productos/health http://127.0.0.1:3002/health
    ProxyPassReverse /api/productos/health http://127.0.0.1:3002/health

    ProxyPass        /api/clientes/health http://127.0.0.1:3003/health
    ProxyPassReverse /api/clientes/health http://127.0.0.1:3003/health

    ProxyPass        /api/pedidos/health http://127.0.0.1:3004/health
    ProxyPassReverse /api/pedidos/health http://127.0.0.1:3004/health

    # Microservicios
    ProxyPass        /api/usuarios http://127.0.0.1:3001/usuarios
    ProxyPassReverse /api/usuarios http://127.0.0.1:3001/usuarios

    ProxyPass        /api/productos http://127.0.0.1:3002/productos
    ProxyPassReverse /api/productos http://127.0.0.1:3002/productos

    ProxyPass        /api/clientes http://127.0.0.1:3003/clientes
    ProxyPassReverse /api/clientes http://127.0.0.1:3003/clientes

    ProxyPass        /api/pedidos http://127.0.0.1:3004/pedidos
    ProxyPassReverse /api/pedidos http://127.0.0.1:3004/pedidos

    ErrorLog ${APACHE_LOG_DIR}/agrored-error.log
    CustomLog ${APACHE_LOG_DIR}/agrored-access.log combined
</VirtualHost>

